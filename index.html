<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special One 🍫</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        /* --- CSS STYLES --- */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* 1. Chocolate Rain Background */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* 2. Main Card Styling */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 350px;
            transition: transform 0.3s ease;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d84315; /* Chocolate/Rust color */
            margin: 0 0 15px 0;
        }

        p { color: #5d4037; font-weight: bold; }

        /* 3. Input & Button */
        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #efebe9;
            border-radius: 15px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: #d84315; }

        button {
            background: linear-gradient(45deg, #d84315, #ff7043);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Pacifico', cursive;
            box-shadow: 0 5px 15px rgba(216, 67, 21, 0.4);
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }

        /* 4. Game Elements */
        #game-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(255, 255, 255, 0.8);
        }
        .floater {
            position: absolute;
            font-size: 50px;
            cursor: pointer;
            animation: floatUp 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(1); opacity: 1; }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }

        /* 5. Final Message */
        #success-view { display: none; }
        .big-heart {
            font-size: 60px;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        #loading-text {
            display: none;
            color: #888;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="rain-container" id="rain"></div>

    <div class="card" id="login-view">
        <h1>Hey Lovely! 🍫</h1>
        <p>I have a small surprise for you.</p>
        <p style="font-size: 0.9em; font-weight: normal;">Enter your number to unlock it:</p>
        
        <input type="tel" id="mobile" placeholder="Mobile Number" maxlength="15">
        <button onclick="handleLogin()">Unlock Surprise</button>
        <div id="loading-text">Checking the magic list...</div>
    </div>

    <div id="game-layer">
        <div style="position: absolute; top: 20px; width: 100%; text-align: center; color: #d84315;">
            <h2 style="font-family: 'Pacifico';">Catch 5 Hearts!</h2>
            <h3 id="score">Score: 0 / 5</h3>
        </div>
    </div>

    <div class="card" id="success-view">
        <div class="big-heart">❤️</div>
        <h1>Happy Chocolate Day!</h1>
        <p id="welcome-msg">You are sweeter than any chocolate.</p>
        <p>You won the game & my heart!</p>
        <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" style="width: 100%; border-radius: 15px; margin-top: 10px;">
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        // ⚠️ REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT URL
        const GOOGLE_SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE"; 
        // ==========================================

        // 1. Background Chocolate Rain
        function startRain() {
            const container = document.getElementById('rain');
            const symbols = ['🍫', '🍬', '❤️', '🧁'];
            
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('drop');
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                el.style.opacity = Math.random();
                container.appendChild(el);
                
                // Cleanup to keep browser happy
                setTimeout(() => el.remove(), 5000);
            }, 300);
        }
        startRain();

        // 2. Login Logic
        function handleLogin() {
            const number = document.getElementById('mobile').value;
            if (number.length < 5) {
                alert("Please enter a valid number!");
                return;
            }

            const btn = document.querySelector('button');
            const loading = document.getElementById('loading-text');
            btn.style.display = 'none'; // Hide button
            loading.style.display = 'block';

            // Send data to Google Sheet
            // We use mode: 'no-cors' to avoid CORS errors. 
            // This means we won't get a readable response JSON, but the data WILL send.
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ number: number })
            }).then(() => {
                // Success (or network request sent)
                checkHistoryAndStart(number);
            }).catch(e => {
                console.error("Error:", e);
                // Even if error, let her play
                checkHistoryAndStart(number);
            });
        }

        // 3. Local Storage Check (Interactive "Feel")
        function checkHistoryAndStart(number) {
            // Check if she played before on this phone
            let visits = localStorage.getItem('choco_visits_' + number);
            visits = visits ? parseInt(visits) + 1 : 1;
            localStorage.setItem('choco_visits_' + number, visits);

            let msg = "You are sweeter than any chocolate.";
            if (visits > 1) {
                msg = "Welcome back my love! <3 (I knew you couldn't stay away)";
            }

            // Update final message
            document.getElementById('welcome-msg').innerText = msg;

            // Start Game
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('game-layer').style.display = 'block';
            startGame();
        }

        // 4. The Game
        let score = 0;
        let gameTimer;
        
        function startGame() {
            gameTimer = setInterval(() => {
                const gameLayer = document.getElementById('game-layer');
                const item = document.createElement('div');
                item.classList.add('floater');
                item.innerText = Math.random() > 0.5 ? '❤️' : '🍫';
                item.style.left = Math.random() * 90 + '%';
                
                // Click logic
                item.onclick = function() {
                    score++;
                    document.getElementById('score').innerText = "Score: " + score + " / 5";
                    
                    // Simple pop effect
                    confetti({
                        particleCount: 10,
                        spread: 30,
                        origin: { x: item.getBoundingClientRect().x / window.innerWidth, y: item.getBoundingClientRect().y / window.innerHeight }
                    });

                    this.remove();

                    if (score >= 5) {
                        winGame();
                    }
                };

                gameLayer.appendChild(item);
                setTimeout(() => item.remove(), 4000);
            }, 600);
        }

        function winGame() {
            clearInterval(gameTimer);
            document.getElementById('game-layer').style.display = 'none';
            document.getElementById('success-view').style.display = 'block';
            
            // FIREWORKS!
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Random fireworks
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
